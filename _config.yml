# The Site Configuration
theme: jekyll-theme-chirpy

title: nestore.dev
tagline: My personal thoughts and adventures
description: >-
  A blog about my thoughts, adventures, and coding projects.

url: "https://nestoredev.github.io"
baseurl: "/my-blog"

github:
  username: nestoredev

social:
  name: John
  links:
    - https://github.com/nestoredev

# Build settings
paginate: 10
toc: true

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      permalink: /posts/:title/
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

# Chirpy options
# This is crucial for fixing the "no styling" issue: 
# Chirpy needs to know where its assets are.
# By default it uses baseurl, but let's be explicit.
img_cdn: ""
avatar: "/assets/img/favicons/apple-touch-icon.png"

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"
